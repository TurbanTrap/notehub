[package]
name = "notehub"
version = "0.1.0"
description = "Offline notebook for study notes"
authors = ["jds"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview load images straight from the vault folder.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
# bundled: compiles SQLite in, so the app does not depend on the system copy, and
# brings FTS5 with it for full-text search.
rusqlite = { version = "0.37", features = ["bundled"] }
# Noticing when a sync client rewrites a note while it is open. Debounced, because
# one incoming file can arrive as a create, several writes and a rename.
notify = "8"
notify-debouncer-full = "0.7"
# Telling "the file I loaded" from "the file on disk now". A weak hash would risk
# silently overwriting the other machine's edit, which is the one thing this must
# never do, so it is worth a real one.
sha2 = "0.11"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
