<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NoteHub">
  <title>NoteHub</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b3fd8"/>
      <stop offset="1" stop-color="#5f1296"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- An N drawn as a graph: four nodes, three edges. The letter is the initial and
       the graph is what the app does — pages that link to each other. -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M168 352V160"/>
    <path d="M168 160l176 192"/>
    <path d="M344 352V160"/>
  </g>
  <g fill="#ffffff">
    <circle cx="168" cy="160" r="40"/>
    <circle cx="168" cy="352" r="40"/>
    <circle cx="344" cy="160" r="40"/>
    <circle cx="344" cy="352" r="40"/>
  </g>
</svg>
