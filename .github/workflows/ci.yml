name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Both shipping platforms, because the things most likely to break on one and
    # not the other are exactly what this project does: file names, path rules and
    # the folder a note is written to.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    # Pinned to commits rather than tags, for the reason spelled out in release.yml.
    # The trailing comment is the tag each SHA stood for when it was pinned.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npx vitest run

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
