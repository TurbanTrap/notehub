name: Installers

# Push a tag to cut a release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Or run it by hand from the Actions tab to get the installers as build
# artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Mac build that runs on both Apple silicon and Intel, rather than
          # two downloads nobody can tell apart.
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only a tag publishes. A manual run leaves the installers attached to
          # the workflow run instead.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: NoteHub ${{ github.ref_name }}
          releaseBody: |
            Neither build is code-signed, so the first launch needs one extra step.

            **macOS** — right-click NoteHub.app and choose Open, then Open again.
            **Windows** — click "More info" on the SmartScreen notice, then "Run anyway".
          releaseDraft: true
          prerelease: false

      - name: Keep the installers on a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: notehub-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
